name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: python -m pip install "pymupdf<2" pillow
      - name: Core
        run: python source/tests_core.py
      - name: Features
        run: python source/tests_features.py
      - name: Interface
        run: python source/tests_ui.py
